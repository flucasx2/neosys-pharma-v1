[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neosys-pharma"
version = "0.1.0"
description = "NeoSys Pharma - Pharmacy management platform"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "sqlalchemy>=2.1,<3.0",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.15,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neosys_pharma.presentation" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
