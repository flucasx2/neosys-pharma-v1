name: P1 P2 P3 P4 tests and PostgreSQL migrations
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - name: SQLite complete suite and migrations
        run: pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neosys_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: neosys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - name: Separate disposable databases for migrations and browser
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://neosys_test:isolated_ci_only@localhost:5432/neosys_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE neosys_migration")
              connection.execute("CREATE DATABASE neosys_browser")
          PY
      - name: PostgreSQL integration and migration checks
        env:
          TEST_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_migration
        run: pytest -q
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neosys_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: neosys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - name: Separate disposable databases for migrations and browser
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://neosys_test:isolated_ci_only@localhost:5432/neosys_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE neosys_migration")
              connection.execute("CREATE DATABASE neosys_browser")
          PY
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser P1 journey
        env:
          DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_browser
          AUTH_COOKIE_SECURE: "false"
        run: |
          alembic upgrade head
          python tests/seed_browser.py
          uvicorn neosys_pharma.presentation.app:app --host 127.0.0.1 --port 8000 > /tmp/p1-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise RuntimeError("Serveur de test non disponible")
          PY
          python tests/browser_p1.py
          python tests/seed_browser_p2.py
          python tests/browser_p2.py
          python tests/browser_p2_complete.py
          python tests/seed_browser_p3.py
          python tests/browser_p3.py
          python tests/browser_etats_p3.py
          python tests/seed_browser_p4.py
          python tests/browser_p4.py
          python tests/browser_proforma.py
          python tests/seed_browser_caisse.py
          python tests/browser_caisse.py
          python tests/seed_browser_regularisation.py
          python tests/browser_regularisation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-browser-screenshots
          path: |
            qa/*.png
            qa/proforma-*.pdf
            qa/p44-*.pdf
            qa/p45-*.pdf
            qa/etats-*.pdf
            qa/etats-*.xlsx
            qa/etats-*.csv
