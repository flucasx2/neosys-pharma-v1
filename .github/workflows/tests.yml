name: NeoSys CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branche applicative à recetter (indépendante du workflow sélectionné)
        required: true
        type: string
      expected_sha:
        description: SHA exact attendu de cette branche (40 caractères)
        required: true
        type: string

permissions:
  contents: read

# Manual recipes have their own group and cannot be cancelled by an automatic run.
concurrency:
  group: neosys-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('auto-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: CI / changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      control_sha: ${{ steps.plan.outputs.control_sha }}
      code: ${{ steps.plan.outputs.code }}
      sqlite: ${{ steps.plan.outputs.sqlite }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI policy (standard library only)
        run: python3 -m unittest discover -s ci/tests -v
      - name: Classify exact changed paths
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 ci/policy.py
      - name: Invalidate previous final validation
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.plan.outputs.sha }}
        run: python3 ci/receipt.py start

  sqlite:
    needs: changes
    if: needs.changes.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - name: SQLite complete suite including HTTP authorization and CSRF
        run: pytest -q

  postgres:
    needs: [changes, sqlite]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgresql: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: neosys_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: neosys_p4p5_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - name: Disposable migration database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://neosys_test:isolated_ci_only@localhost:5432/neosys_p4p5_ci', autocommit=True) as c:
              print(c.execute('select version(), current_database()').fetchone())
              c.execute("COMMENT ON DATABASE neosys_p4p5_ci IS 'NEOSYS_P4P5_DISPOSABLE'")
              c.execute('CREATE DATABASE neosys_consolidation_migrations_ci')
              c.execute("COMMENT ON DATABASE neosys_consolidation_migrations_ci IS 'NEOSYS_CONSOLIDATION_MIGRATIONS_DISPOSABLE'")
              c.execute('CREATE DATABASE neosys_p5conf1b_ci')
              c.execute("COMMENT ON DATABASE neosys_p5conf1b_ci IS 'NEOSYS_P5CONF1B_DISPOSABLE_CI'")
              c.execute('CREATE DATABASE neosys_p5c_migrations_ci')
              c.execute("COMMENT ON DATABASE neosys_p5c_migrations_ci IS 'NEOSYS_P5C_DISPOSABLE'")
              c.execute('CREATE DATABASE neosys_migration')
              c.execute('CREATE DATABASE neosys_p4b_migration')
              c.execute('CREATE DATABASE neosys_p4c_migration')
          PY
      - name: PostgreSQL suite, concurrency, security and migration cycles
        env:
          TEST_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_p4p5_ci
          P4P5_CONFIRM_DATABASE: neosys_p4p5_ci
          TEST_CONSOLIDATION_MIGRATION_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_consolidation_migrations_ci
          CONSOLIDATION_CONFIRM_DATABASE: neosys_consolidation_migrations_ci
          TEST_P5CONF1B_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_p5conf1b_ci
          P5CONF1B_CONFIRM_DATABASE: neosys_p5conf1b_ci
          P5CONF1B_MARKER: NEOSYS_P5CONF1B_DISPOSABLE_CI
          TEST_P5C_MIGRATION_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_p5c_migrations_ci
          P5C_CONFIRM_DATABASE: neosys_p5c_migrations_ci
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_migration
          TEST_P4B_MIGRATION_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_p4b_migration
          TEST_P4C_MIGRATION_DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_p4c_migration
          P4B_CI_DISPOSABLE_DATABASE: '1'
          P4C_CI_DISPOSABLE_DATABASE: '1'
        run: pytest -q

  browser:
    needs: [changes, sqlite]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neosys_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: neosys_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - name: Chromium dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: DOM and Chromium modules (HTTP simulated, no financial evidence)
        env:
          NODE_PATH: /tmp/neosys-dom/node_modules
        run: |
          npm install --prefix /tmp/neosys-dom --no-audit --no-fund jsdom@30.1.3 playwright@1.58.0
          node tests/finitions_caisse_ui.cjs
          node tests/import_catalogue_resultat_ui.cjs
          node tests/import_beneficiaires_ui.cjs
          node tests/creances_ui.cjs
          node tests/creances_ui.cjs --chromium
          node tests/conventions_ui.cjs --chromium
          node tests/groupe_organismes_ui.cjs --chromium
          node tests/moyens_paiement_ui.cjs --chromium
      - name: Checkout pinned CI controller independently of application code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.control_sha }}
          path: .ci-control
          persist-credentials: false
      - name: Browser journeys, including P4-B clients, in seed order
        env:
          DATABASE_URL: postgresql+psycopg://neosys_test:isolated_ci_only@localhost:5432/neosys_browser
          AUTH_COOKIE_SECURE: 'false'
          CI: 'true'
          P4C4_CI_DISPOSABLE_DATABASE: '1'
          GROUPED_ENCASHMENT_ENABLED: 'true'
        run: python .ci-control/ci/browser.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: neosys-recipe-${{ needs.changes.outputs.sha }}-${{ github.run_id }}
          # Does not delete or change retention of existing P4.5 artifacts.
          retention-days: 30
          path: |
            qa/*.png
            qa/*.pdf
            qa/etats-*.xlsx
            qa/etats-*.csv
            /tmp/neosys-ci-server.log

  result:
    name: CI / synthèse
    if: ${{ always() && !cancelled() }}
    needs: [changes, sqlite, postgres, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned CI controller independently of application code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.control_sha || github.event.pull_request.head.sha || github.sha }}
          path: .ci-control
          persist-credentials: false
      - name: Publish exact-commit recipe status
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.changes.outputs.sha }}
          FULL: ${{ needs.changes.outputs.full }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          JOB_RESULTS: '{"sqlite":"${{ needs.sqlite.result }}","postgres":"${{ needs.postgres.result }}","browser":"${{ needs.browser.result }}"}'
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          export ACTUAL_SHA
          python3 .ci-control/ci/receipt.py finish
